[project]
name = "quantpilot"
version = "0.3.0"
description = "量化交易的乐高积木 — 用户选股、搭策略、跑回测、接券商"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    # Data
    "baostock>=0.9",
    "pandas>=2.0",
    "numpy>=1.24",

    # Web
    "fastapi>=0.100",
    "uvicorn>=0.23",
]

[project.optional-dependencies]
ml = [
    "lightgbm>=4.0",
    "shap>=0.42",
    "scikit-learn>=1.3",
]
dev = [
    "pytest>=7.4",
    "ruff>=0.1",
]

[project.scripts]
quantpilot-demo = "examples.simple_ma:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quantpilot"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
