[project]
name = "quantpilot"
version = "0.1.0"
description = "AI-Powered Investment Research Workbench for A-Share Market"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }

dependencies = [
    # MCP
    "mcp>=1.0",
    "fastmcp>=2.0",
    
    # ML
    "lightgbm>=4.3",
    "shap>=0.45",
    "optuna>=3.6",
    
    # Data
    "akshare>=1.14",
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=15.0",
    
    # Utils
    "pydantic>=2.7",
    "rich>=13.7",
]

[project.optional-dependencies]
web = [
    "fastapi>=0.111",
    "uvicorn>=0.30",
]
dev = [
    "pytest>=8.2",
    "ruff>=0.4",
]

[project.scripts]
quantpilot-mcp = "quantpilot.mcp_server:main"
quantpilot-train = "quantpilot.cli_train:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quantpilot"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
