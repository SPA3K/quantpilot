name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: pip install -e .
      - name: Syntax check
        run: python -m compileall -q src
      - name: Smoke import
        run: python -c "import quantpilot; print('quantpilot', quantpilot.__version__)"
